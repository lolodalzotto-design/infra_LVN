<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage LVN</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="./garage.css?v=20261105-ccf-inline">
<main>
<div class="step-title"><span class="step-number">1</span>Je signale</div>
<div class="segmented" aria-label="Type de remontée">
<a class="segment-btn" href="../?type=infra" style="text-align:center;text-decoration:none">INFRA</a>
<a class="segment-btn" href="../?type=hcc" style="text-align:center;text-decoration:none">HCC</a>
<a class="segment-btn active" href="./" aria-current="page" style="text-align:center;text-decoration:none">GARAGE</a>
</div>
<section id="agent" class="progressive-step garage-panel">
<div class="segmented" aria-label="Choix de l’engin">
<button type="button" class="segment-btn vehicle-state" data-agent-vehicle="1" aria-pressed="false">Engin 1</button>
<button type="button" class="segment-btn vehicle-state" data-agent-vehicle="2" aria-pressed="false">Engin 2</button>
<button type="button" class="segment-btn vehicle-state" data-agent-vehicle="3" aria-pressed="false">Engin 3</button>
<button type="button" class="segment-btn vehicle-state" data-agent-vehicle="4" data-state="maintenance" aria-pressed="false">Engin 4</button>
<button type="button" class="segment-btn vehicle-state" data-agent-vehicle="5" data-state="operational" aria-pressed="false">CCF 4-1-17</button>
<button type="button" class="segment-btn vehicle-state" data-agent-vehicle="6" data-state="operational" aria-pressed="false">CCF 4-1-16</button>
</div>
<div id="agent-detail" hidden>
<div id="agent-viewer"><div id="viewer">
<div class="scene plan-navigable" id="scene" tabindex="0" aria-label="Vue de l’engin. Flèches pour tourner, Entrée pour marquer la face visible." style="position:relative">
<div class="cube" id="cube"></div>
<canvas id="ccf-view" class="ccf-view" aria-hidden="true" hidden></canvas>
<div class="plan-nav-controls" aria-label="Zoom et plein écran">
<button type="button" id="zoom-in" aria-label="Zoomer">+</button>
<button type="button" id="zoom-out" aria-label="Dézoomer">−</button>
<button type="button" id="zoom-reset" aria-label="Recentrer">↺</button>
<button type="button" id="clear" aria-label="Effacer le repère" title="Effacer le repère">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="m7 20-4-4a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L14 20H7Zm3-12 8 8M7 20h14"/>
</svg>
</button>
<button type="button" id="cube-fullscreen" data-plan-fullscreen aria-label="Plein écran" title="Plein écran">⛶</button>
</div>
</div>
</div></div>
<output id="status" aria-live="polite" hidden></output>
<form id="report">
<div class="field">
<label for="description">Décrire l’anomalie</label>
<textarea id="description" required maxlength="240" rows="3"></textarea>
</div>
<fieldset>
<legend>Dysfonctionnement ?</legend>
<label><input type="radio" name="malfunction" value="yes" required> Oui</label>
<label><input type="radio" name="malfunction" value="no"> Non</label>
</fieldset>
<div id="actions-field" class="field" hidden>
<label for="actions-taken">Quelles actions avez-vous menées ?</label>
<textarea id="actions-taken" maxlength="240" rows="3" disabled></textarea>
</div>
<div class="field">
<label for="photo-file">Pièce jointe</label>
<input type="file" id="photo-file" accept="image/*">
</div>
<p><button class="primary" type="submit">Envoyer au Garage</button></p>
</form>
<output id="report-result" aria-live="polite"></output>
</div>
</section>
</main>
<script type="module" src="./page.js?v=20261105-ccf-inline"></script>
</html>
