<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage LVN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#15283a;font:1rem system-ui}main{max-width:780px;margin:auto;padding:24px}header,section{background:white;border-radius:18px;padding:24px;margin-bottom:16px}header{background:#12263b;color:white}h1{margin:8px 0}button,select,textarea{font:inherit}button,select{border:1px solid #8a9bad;background:white;color:#15283a;border-radius:8px;padding:10px;margin:3px}button{cursor:pointer}button[aria-pressed=true]{background:#153e63;color:white}.grid[hidden]{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.scene{height:320px;display:grid;place-items:center;perspective:620px;touch-action:none;user-select:none;background:#e1edf6;border-radius:14px;cursor:grab}.cube{position:relative;width:130px;height:130px;transform-style:preserve-3d}.face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;background:#325d7c;color:white;border:2px solid #b0c9db}.face:nth-child(even){background:#244963}.pin{position:absolute;width:16px;height:16px;border:2px solid white;border-radius:50%;background:#f74c35;transform:translate(-50%,-50%);pointer-events:none}.controls{margin-top:12px}output{display:block;margin-top:12px;font-weight:600}
</style>
<main>
<header><small>CASERNE DE LOUVAIN </small><h1>Garage</h1><div>Suivi des engins</div></header>
<p><a href="../">Retour à Je signale</a></p>
<nav aria-label="Espaces"><button id="agent-tab" aria-pressed="true">Espace agent</button><button id="service-tab" aria-pressed="false">Espace service</button></nav>
<section id="agent">
<h2>Déclarer une anomalie</h2>
<label for="vehicle">Engin concerné</label>
<select id="vehicle"><option>Engin 1</option><option>Engin 2</option><option>Engin 3</option></select>
<p>Fais glisser le cube pour le tourner. Touche ou clique sur une face pour poser un repère.</p>
<div class="scene" id="scene"><div class="cube" id="cube"></div></div>
<div class="controls" aria-label="Orientation du cube">
<button data-turn="left" aria-label="Tourner à gauche">←</button><button data-turn="right" aria-label="Tourner à droite">→</button><button data-turn="up" aria-label="Tourner vers le haut">↑</button><button data-turn="down" aria-label="Tourner vers le bas">↓</button>
<button id="center">Marquer la face visible</button><button id="clear">Effacer le repère</button>
</div>
<output id="status" aria-live="polite">Aucun repère posé.</output>
<form id="report">
<p><label for="description">Décris l’anomalie</label></p>
<textarea id="description" required maxlength="240" rows="3"></textarea>
<p><button type="submit">Envoyer au Garage</button></p>
</form>
<output id="report-result" aria-live="polite"></output>
</section>
<section id="service" hidden>
<h2>Engins du garage</h2>
<form id="login">
<p><label>Adresse e-mail <input type="email" id="email" required autocomplete="username"></label></p>
<p><label>Mot de passe <input type="password" id="password" required autocomplete="current-password"></label></p>
<button>Se connecter</button>
</form>
<div id="vehicles" class="grid" hidden>
<button data-vehicle="1">Engin 1</button><button data-vehicle="2">Engin 2</button><button data-vehicle="3">Engin 3</button>
</div>
<button id="logout" hidden>Se déconnecter</button>
<p id="service-status" role="status"></p>
<ul id="reports"></ul>
</section>
</main>
<script type="module" src="./garage.js"></script>
</html>
