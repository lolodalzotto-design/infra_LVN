<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage LVN</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="./garage.css">
<main class="garage-main">
<header class="hero"><small>CASERNE DE LOUVAIN </small><h1>Garage</h1><div>Suivi des engins</div></header>
<p><a href="../">Retour à Je signale</a></p>
<section id="agent" class="form-card garage-panel">
<h2>Déclarer une anomalie</h2>
<div class="step-title">Quel engin est concerné ?</div>
<div class="segmented" aria-label="Choix de l’engin">
<button type="button" class="segment-btn" data-agent-vehicle="1" aria-pressed="false">Engin 1</button>
<button type="button" class="segment-btn" data-agent-vehicle="2" aria-pressed="false">Engin 2</button>
<button type="button" class="segment-btn" data-agent-vehicle="3" aria-pressed="false">Engin 3</button>
</div>
<div id="agent-detail" hidden>
<h3 id="vehicle-title"></h3>
<div id="agent-viewer"><div id="viewer">
<p>Fais glisser pour tourner. Passe en plein écran pour zoomer.</p>
<div class="scene plan-navigable" id="scene" style="position:relative">
<div class="cube" id="cube"></div>
<div class="plan-nav-controls" aria-label="Zoom et plein écran">
<button type="button" id="zoom-in" aria-label="Zoomer">+</button>
<button type="button" id="zoom-out" aria-label="Dézoomer">−</button>
<button type="button" id="zoom-reset" aria-label="Recentrer">↺</button>
<button type="button" id="cube-fullscreen" data-plan-fullscreen aria-label="Plein écran" title="Plein écran">⛶</button>
</div>
</div>
<div class="controls" aria-label="Orientation et zoom du cube">
<button class="segment-btn" data-turn="left" aria-label="Tourner à gauche">←</button><button class="segment-btn" data-turn="right" aria-label="Tourner à droite">→</button><button class="segment-btn" data-turn="up" aria-label="Tourner vers le haut">↑</button><button class="segment-btn" data-turn="down" aria-label="Tourner vers le bas">↓</button>
<button class="segment-btn" id="center">Marquer la face visible</button><button class="segment-btn" id="clear">Effacer le repère</button>
</div>
</div></div>
<p>En plein écran, touche le point d’impact pour le valider et revenir au formulaire.</p>
<output id="status" aria-live="polite">Aucun repère posé.</output>
<form id="report">
<p><label for="description">Décris l’anomalie</label></p>
<textarea id="description" required maxlength="240" rows="3"></textarea>
<p><button class="primary" type="submit">Envoyer au Garage</button></p>
</form>
<output id="report-result" aria-live="polite"></output>
</div>
</section>
</main>
<script type="module" src="./page.js"></script>
</html>
