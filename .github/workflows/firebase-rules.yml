name: Deploy Firebase rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - ".github/workflows/firebase-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Deploy Firestore and Storage rules via Firebase Rules API
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT_ID: infra-lvn-9f349
          STORAGE_BUCKET: infra-lvn-9f349.firebasestorage.app
        run: |
          set -euo pipefail

          create_ruleset() {
            local file="$1"
            local payload
            payload="$(jq -n --rawfile rules "$file" --arg name "$file"               '{source:{files:[{name:$name,content:$rules}]}}')"

            curl --fail-with-body --silent --show-error               -X POST               -H "Authorization: Bearer $ACCESS_TOKEN"               -H "Content-Type: application/json"               -d "$payload"               "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/rulesets"               | tee "/tmp/${file}.ruleset.json" >/dev/null

            jq -r '.name' "/tmp/${file}.ruleset.json"
          }

          release_ruleset() {
            local release_name="$1"
            local ruleset_name="$2"
            local payload
            payload="$(jq -n --arg rulesetName "$ruleset_name" '{rulesetName:$rulesetName}')"

            curl --fail-with-body --silent --show-error               -X PATCH               -H "Authorization: Bearer $ACCESS_TOKEN"               -H "Content-Type: application/json"               -d "$payload"               "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/releases/$release_name?updateMask=rulesetName"               >/dev/null
          }

          FIRESTORE_RULESET="$(create_ruleset firestore.rules)"
          release_ruleset "cloud.firestore" "$FIRESTORE_RULESET"
          echo "Firestore rules published: $FIRESTORE_RULESET"

          STORAGE_RULESET="$(create_ruleset storage.rules)"
          release_ruleset "firebase.storage/$STORAGE_BUCKET" "$STORAGE_RULESET"
          echo "Storage rules published: $STORAGE_RULESET"
