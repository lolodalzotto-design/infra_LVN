name: Deploy Firebase rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - ".github/workflows/firebase-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Load Google service account
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Create OAuth access token
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const credentials = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8'));
          const b64url = (value) => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);

          const header = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const payload = b64url(JSON.stringify({
            iss: credentials.client_email,
            scope: 'https://www.googleapis.com/auth/cloud-platform',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600
          }));

          const unsigned = `${header}.${payload}`;
          const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), credentials.private_key).toString('base64url');
          const assertion = `${unsigned}.${signature}`;

          fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion
            })
          })
            .then(async (response) => {
              const body = await response.json();
              if (!response.ok || !body.access_token) {
                throw new Error(JSON.stringify(body));
              }
              console.log(`::add-mask::${body.access_token}`);
              fs.appendFileSync(process.env.GITHUB_ENV, `ACCESS_TOKEN=${body.access_token}\n`);
            })
            .catch((error) => {
              console.error(error.message);
              process.exit(1);
            });
          NODE

      - name: Deploy Firestore and Storage rules via Firebase Rules API
        env:
          PROJECT_ID: infra-lvn-9f349
          STORAGE_BUCKET: infra-lvn-9f349.firebasestorage.app
        run: |
          set -euo pipefail

          create_ruleset() {
            local file="$1"
            local payload response status
            payload="$(jq -n --rawfile rules "$file" --arg name "$file" '{source:{files:[{name:$name,content:$rules}]}}')"

            response="$(curl --silent --show-error               -X POST               -H "Authorization: Bearer $ACCESS_TOKEN"               -H "Content-Type: application/json"               -d "$payload"               -w $'\n%{http_code}'               "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/rulesets")"

            status="$(printf '%s' "$response" | tail -n1)"
            printf '%s' "$response" | sed '$d' > "/tmp/${file}.ruleset.json"

            if [[ ! "$status" =~ ^2 ]]; then
              echo "Firebase Rules API error while creating $file (HTTP $status):" >&2
              cat "/tmp/${file}.ruleset.json" >&2
              return 1
            fi

            jq -r '.name' "/tmp/${file}.ruleset.json"
          }

          release_ruleset() {
            local release_name="$1"
            local ruleset_name="$2"
            local payload response status
            payload="$(jq -n --arg name "projects/$PROJECT_ID/releases/$release_name" --arg rulesetName "$ruleset_name" '{release:{name:$name,rulesetName:$rulesetName}}')"

            response="$(curl --silent --show-error               -X PATCH               -H "Authorization: Bearer $ACCESS_TOKEN"               -H "Content-Type: application/json"               -d "$payload"               -w $'\n%{http_code}'               "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/releases/$release_name")"

            status="$(printf '%s' "$response" | tail -n1)"
            if [[ ! "$status" =~ ^2 ]]; then
              echo "Firebase Rules API error while releasing $release_name (HTTP $status):" >&2
              printf '%s' "$response" | sed '$d' >&2
              return 1
            fi
          }

          FIRESTORE_RULESET="$(create_ruleset firestore.rules)"
          release_ruleset "cloud.firestore" "$FIRESTORE_RULESET"
          echo "Firestore rules published: $FIRESTORE_RULESET"

          STORAGE_RULESET="$(create_ruleset storage.rules)"
          release_ruleset "firebase.storage/$STORAGE_BUCKET" "$STORAGE_RULESET"
          echo "Storage rules published: $STORAGE_RULESET"
