<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d223a" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="application-name" content="Infra-LVN" />
  <meta name="apple-mobile-web-app-title" content="Infra-LVN" />
  <meta name="description" content="Suivi Infra de la caserne" />
  <title>Infra-LVN</title>
  <link rel="stylesheet" href="./styles.css?v=20261008-hcc-1" />
</head>
<body>
<main>
    <div class="step-title"><span class="step-number">1</span>Je signale</div>
    <div class="segmented" aria-label="Type de remontée">
      <button type="button" class="segment-btn" data-report-type="infra">INFRA</button>
      <button type="button" class="segment-btn" data-report-type="hcc">HCC</button>
    </div>

    <section id="location-flow" class="progressive-step hidden">
      <div class="step-title"><span id="building-step-number" class="step-number">2</span>Dans quel bâtiment êtes-vous ?</div>
      <div class="segmented" aria-label="Choix du bâtiment">
        <button type="button" class="segment-btn" data-building="A">Bâtiment A</button>
        <button type="button" class="segment-btn" data-building="B">Bâtiment B</button>
      </div>
    </section>

    <section id="step-2" class="progressive-step hidden">
      <div class="step-title"><span id="level-step-number" class="step-number">3</span>À quel niveau êtes-vous ?</div>
      <div id="level-buttons" class="segmented level-segmented" aria-label="Choix du niveau"></div>
    </section>

    <section id="step-3" class="progressive-step hidden">
      <div class="step-title"><span id="zone-step-number" class="step-number">4</span>Dans quelle partie êtes-vous ?</div>
      <div id="zone-buttons" class="segmented" aria-label="Choix de la zone"></div>
    </section>

    <section id="step-4" class="progressive-step hidden">
      <div class="step-title"><span id="room-step-number" class="step-number">5</span>Sélectionnez la pièce</div>
      <section id="plans" class="plans-grid single-plan"></section>
    </section>

    <section id="report-card" class="form-card hidden">
      <div class="step-title" style="margin-top:0"><span id="form-step-number" class="step-number">6</span><span id="form-step-title">Décrivez le problème</span></div>
      <div class="selected-room">✓ <span id="selected-room-text"></span></div>

      <form id="report-form">
        <div class="form-grid">
          <div class="field">
            <label for="lastName">Nom *</label>
            <input id="lastName" name="lastName" autocomplete="family-name" required maxlength="60" />
          </div>
          <div class="field">
            <label for="firstName">Prénom *</label>
            <input id="firstName" name="firstName" autocomplete="given-name" required maxlength="60" />
          </div>
          <div class="field full">
            <label id="description-label" for="description">Quel est le problème ? *</label>
            <textarea id="description" name="description" required maxlength="240" placeholder="Ex. : la chasse d’eau fuit en continu"></textarea>
            <span id="category-preview" class="help">La catégorie sera déterminée automatiquement.</span>
          </div>
          <div class="field full">
            <label for="photo">Photo <span class="help">(1 maximum, recommandée)</span></label>
            <input id="photo" name="photo" type="file" accept="image/*" capture="environment" />
          </div>
          <div id="urgent-field" class="field full">
            <label class="urgent-toggle">
              <input type="checkbox" name="urgent" />
              <span>🚨 <strong>Urgent</strong> — nécessite une attention rapide</span>
            </label>
          </div>
        </div>
        <div class="submit-row">
          <button id="submit-btn" class="primary" type="submit">Soumettre le signalement</button>
        </div>
      </form>
    </section>
  </main>

  <footer>Infra-LVN • Remontée d'information</footer>
  <script>
    window.__infraLvnBoot = false;
    setTimeout(() => {
      if (!window.__infraLvnBoot) {
        const box = document.createElement('div');
        box.className = 'boot-error';
        box.textContent = 'Erreur de chargement de l’application. Rechargez la page.';
        document.body.prepend(box);
      }
    }, 4500);
  </script>
  <script type="module" src="./js/public.js?v=20261008-hcc-2"></script>
</body>
</html>
