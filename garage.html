<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage LVN · Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#15283a;font:1rem system-ui}main{max-width:780px;margin:auto;padding:24px}header,section{background:white;border-radius:18px;padding:24px;margin-bottom:16px}header{background:#12263b;color:white}h1{margin:8px 0}button,select,textarea{font:inherit}button,select{border:1px solid #8a9bad;background:white;color:#15283a;border-radius:8px;padding:10px;margin:3px}button{cursor:pointer}button[aria-pressed=true]{background:#153e63;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.scene{height:320px;display:grid;place-items:center;perspective:620px;touch-action:none;user-select:none;background:#e1edf6;border-radius:14px;cursor:grab}.cube{position:relative;width:130px;height:130px;transform-style:preserve-3d}.face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;background:#325d7c;color:white;border:2px solid #b0c9db}.face:nth-child(even){background:#244963}.pin{position:absolute;width:16px;height:16px;border:2px solid white;border-radius:50%;background:#f74c35;transform:translate(-50%,-50%);pointer-events:none}.controls{margin-top:12px}output{display:block;margin-top:12px;font-weight:600}
</style>
<main>
<header><small>CASERNE DE LOUVAIN · PROTOTYPE</small><h1>Garage</h1><div>Suivi des engins</div></header>
<p><a href="./">Retour à Je signale</a></p>
<nav aria-label="Espaces"><button id="agent-tab" aria-pressed="true">Espace agent</button><button id="service-tab" aria-pressed="false">Espace service</button></nav>
<section id="agent">
<h2>Déclarer une anomalie</h2>
<label for="vehicle">Engin concerné</label>
<select id="vehicle"><option>Engin 1</option><option>Engin 2</option><option>Engin 3</option></select>
<p>Fais glisser le cube pour le tourner. Touche ou clique sur une face pour poser un repère.</p>
<div class="scene" id="scene"><div class="cube" id="cube"></div></div>
<div class="controls" aria-label="Orientation du cube">
<button data-turn="left" aria-label="Tourner à gauche">←</button><button data-turn="right" aria-label="Tourner à droite">→</button><button data-turn="up" aria-label="Tourner vers le haut">↑</button><button data-turn="down" aria-label="Tourner vers le bas">↓</button>
<button id="center">Marquer la face visible</button><button id="clear">Effacer le repère</button>
</div>
<output id="status" aria-live="polite">Aucun repère posé.</output>
<p>Démo de localisation. Aucun signalement n’est transmis.</p>
</section>
<section id="service" hidden><h2>Engins du garage</h2><div class="grid"><button disabled>Engin 1</button><button disabled>Engin 2</button><button disabled>Engin 3</button></div></section>
</main>
<script>
const byId = id => document.getElementById(id);
const cube = byId('cube');
const scene = byId('scene');
const names = ['Avant', 'Arrière', 'Droite', 'Gauche', 'Dessus', 'Dessous'];
const transforms = ['rotateY(0deg)', 'rotateY(180deg)', 'rotateY(90deg)', 'rotateY(-90deg)', 'rotateX(90deg)', 'rotateX(-90deg)'];
const marks = new Map();
let x = -20;
let y = -30;
let gesture;
names.forEach((name, index) => {
  const face = document.createElement('div');
  face.className = 'face';
  face.dataset.face = name;
  face.textContent = name;
  face.style.transform = transforms[index] + ' translateZ(65px)';
  cube.append(face);
});
function rotate() {
  cube.style.transform = 'rotateX(' + x + 'deg) rotateY(' + y + 'deg)';
}
function renderMark() {
  cube.querySelector('.pin')?.remove();
  const mark = marks.get(byId('vehicle').selectedIndex);
  byId('status').textContent = mark ? byId('vehicle').value + ' · ' + mark.face.dataset.face : 'Aucun repère posé.';
  if (!mark) return;
  const pin = document.createElement('span');
  pin.className = 'pin';
  pin.style.left = mark.u + '%';
  pin.style.top = mark.v + '%';
  mark.face.append(pin);
}
function mark(face, u, v) {
  marks.set(byId('vehicle').selectedIndex, {face, u, v});
  renderMark();
}
scene.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.button !== 0) return;
  gesture = {id:event.pointerId, sx:event.clientX, sy:event.clientY, x, y, dragged:false, face:event.target, u:event.offsetX / event.target.clientWidth * 100, v:event.offsetY / event.target.clientHeight * 100};
  scene.setPointerCapture(event.pointerId);
});
scene.addEventListener('pointermove', event => {
  if (gesture?.id !== event.pointerId) return;
  const dx = event.clientX - gesture.sx;
  const dy = event.clientY - gesture.sy;
  if (!gesture.dragged && Math.hypot(dx, dy) < 6) return;
  gesture.dragged = true;
  x = gesture.x - dy;
  y = gesture.y + dx;
  rotate();
});
scene.addEventListener('pointerup', event => {
  if (gesture?.id !== event.pointerId) return;
  if (!gesture.dragged) {
    if (gesture.face.classList.contains('face')) {
      mark(gesture.face, gesture.u, gesture.v);
    }
  }
  gesture = undefined;
});
scene.addEventListener('lostpointercapture', () => { gesture = undefined; });
document.querySelectorAll('[data-turn]').forEach(button => button.onclick = () => {
  const delta = {left:[0,-45],right:[0,45],up:[-45,0],down:[45,0]}[button.dataset.turn];
  x += delta[0];
  y += delta[1];
  rotate();
});
byId('center').onclick = () => {
  const box = scene.getBoundingClientRect();
  const face = document.elementFromPoint(box.left + box.width/2, box.top + box.height/2);
  if (face?.classList.contains('face')) mark(face,50,50);
};
byId('clear').onclick = () => {
  marks.delete(byId('vehicle').selectedIndex);
  renderMark();
};
byId('vehicle').onchange = renderMark;
function showAgent(show) {
  byId('agent').hidden = !show;
  byId('service').hidden = show;
  byId('agent-tab').setAttribute('aria-pressed', show);
  byId('service-tab').setAttribute('aria-pressed', !show);
}
byId('agent-tab').onclick = () => showAgent(true);
byId('service-tab').onclick = () => showAgent(false);
rotate();
</script>
</html>
