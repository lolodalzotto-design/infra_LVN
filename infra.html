<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d223a" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Espace Infra — LVN</title>
  <link rel="stylesheet" href="./styles.css?v=20261007-0845" />
</head>
<body>
<main>
    <section id="login-wrap" class="login-wrap">
      <div class="login-card">
        <h2>Accès responsable Infra</h2>
        <p class="help">Cet espace est réservé au service infrastructure.</p>
        <form id="login-form" novalidate>
          <div class="field"><label for="username">Nom d’utilisateur</label><input id="username" type="text" autocomplete="username" placeholder="infra_lvn" /></div>
          <div class="field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" /></div>
          <p id="login-error" class="login-error hidden" role="alert"></p>
          <button class="primary" type="submit">Se connecter</button>
        </form>
      </div>
    </section>

    <section id="infra-shell" class="infra-shell">
      <div class="dashboard-heading">
        <h1>Tableau de bord</h1>
        <button id="logout-btn" class="secondary hidden" type="button">Déconnexion</button>
      </div>

      <section class="dashboard-grid">
        <article class="kpi"><div class="label">Anomalies totales</div><div id="kpi-total" class="value">0</div></article>
        <article class="kpi"><div class="label">À traiter</div><div id="kpi-open" class="value">0</div></article>
        <article class="kpi"><div class="label">En cours</div><div id="kpi-progress" class="value">0</div></article>
        <article class="kpi"><div class="label">Résolues</div><div id="kpi-resolved" class="value">0</div><div class="progress"><span id="kpi-bar" style="width:0%"></span></div><div id="kpi-percent" class="help" style="margin-top:6px">0 % réalisé</div></article>
      </section>

      <div class="toolbar">
        <select id="filter-status"><option value="all">Tous les statuts</option><option value="active">Actives uniquement</option><option value="a_traiter">À traiter</option><option value="en_cours">En cours</option><option value="resolu">Résolues</option></select>
        <select id="filter-category"><option value="all">Toutes les catégories</option></select>
        <select id="filter-building"><option value="all">Tous les bâtiments</option><option value="A">Bâtiment A</option><option value="B">Bâtiment B</option></select>
        <input id="filter-search" type="search" placeholder="Rechercher…" />
      </div>

      <section class="panel">
        <h2>Liste des anomalies <span id="list-count" class="help"></span></h2>
        <div id="anomaly-list" class="anomaly-list"></div>
      </section>
    </section>
  </main>

  <footer>infra_LVN • Suivi des anomalies</footer>
  <div id="modal-root"></div>
  <script type="module" src="./js/infra.js?v=20261007-0845"></script>
</body>
</html>
